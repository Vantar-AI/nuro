name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Core tests (Python 3.10, 3.11, 3.12) ─────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install core + dev deps
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Run core tests (no GPU, no Loihi)
        run: pytest tests/ -v --ignore=tests/test_loihi_backend.py -x

  # ── Loihi tests (Python 3.10 + lava-nc) ──────────────────────────────────
  test-loihi:
    name: Loihi backend (Python 3.10 + lava-nc)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Loihi deps
        run: pip install -e ".[loihi,dev]"

      - name: Run Loihi tests
        run: pytest tests/test_loihi_backend.py -v

  # ── GPU tests (Python 3.11, CPU-only torch) ───────────────────────────────
  test-gpu:
    name: GPU backend (CPU torch)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GPU deps (CPU-only torch for CI)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install spikingjelly
          pip install -e ".[dev]"

      - name: Run GPU backend tests
        run: pytest tests/test_gpu_backend.py tests/test_gradients.py tests/test_neuron_models.py -v
